<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coding Keyboard Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --primary: #2563eb;
      --emerald: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 300px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 26px;
      height: 26px;
      border-radius: 7px;
    }
    .title {
      font-size: 13.5px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--text);
    }
    .version-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .shortcut-display {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .record-btn {
      padding: 7px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .row-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 7px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .checkbox-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #334155;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #f8fafc;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .hint {
      font-size: 11px;
      color: var(--subtext);
      text-align: center;
      line-height: 1.5;
      margin-top: 2px;
    }

    .header-right {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bug-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--subtext);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .bug-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }
    .bug-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img class="logo" src="icons/icon128.png" alt="">
      <span class="title">Coding Keyboard Simulator</span>
    </div>
    <div class="header-right">
      <button id="bugBtn" class="bug-btn" type="button" title="Report a bug" aria-label="Report a bug">
        <svg viewBox="0 0 24 24"><path d="M8 2l1.9 1.9M16 2l-1.9 1.9M9 7.1v-.6a3 3 0 0 1 6 0v.6"/><path d="M12 20a6 6 0 0 1-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3a6 6 0 0 1-6 6z"/><path d="M12 20v-9M6 13H2M22 13h-4M6 17l-3 2M18 17l3 2M6 9L3 7M18 9l3-2"/></svg>
      </button>
      <span class="version-badge" id="version">v1.0.0</span>
    </div>
  </div>

  <div class="card">
    <div class="row-label">Human typing</div>
    <div class="shortcut-row">
      <div id="humanDisplay" class="shortcut-display">Alt + V</div>
      <button id="humanBtn" class="record-btn">Record Key</button>
    </div>
  </div>

  <div class="card">
    <div class="row-label">Direct paste</div>
    <div class="shortcut-row">
      <div id="pasteDisplay" class="shortcut-display">Alt + Shift + V</div>
      <button id="pasteBtn" class="record-btn">Record Key</button>
    </div>
  </div>

  <div class="hint">Click inside an editor, then press a shortcut. Esc stops typing.</div>

  <script src="popup.js"></script>
</body>
</html>
